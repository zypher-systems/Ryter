[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# Maintenance notices only; vulnerability advisories remain errors.
ignore = [
    # Syntect loads compiled-in syntax assets through bincode; no untrusted dumps.
    { id = "RUSTSEC-2025-0141", reason = "No maintained syntect release replaces bincode; only bundled syntax assets are deserialized. Track replacement upstream." },
    # This proc macro runs at build time through ratatui 0.29.
    { id = "RUSTSEC-2024-0436", reason = "Ratatui 0.29 uses paste at build time. A ratatui migration requires a separate terminal rendering review." },
]

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSL-1.0", "ISC", "MIT", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

# dirs-sys uses this unmodified MPL library; its source is linked in release notices.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
