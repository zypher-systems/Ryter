name: release

# Pushing a tag like v0.2.0 builds every binary and opens a *draft* release
# with them attached; a person reviews and publishes it. Running the workflow
# by hand (Actions → release → Run workflow), or a pull request that changes
# packaging, builds the same binaries as downloadable artifacts without a
# release: a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A change to how releases are built is built on its pull request, so a
  # packaging break shows up in review, not on release day. No release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - Cargo.toml
      - Cargo.lock

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries: they run on any Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Macs, cross-built on an Apple Silicon runner.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        # Marks the binaries this workflow publishes: only they replace
        # themselves with `ryter update`. A cargo build updates the way it was built.
        env:
          RYTER_RELEASE_BUILD: "1"
        run: cargo build --release --locked -p ryter-cli --target ${{ matrix.target }}
      - name: smoke test
        # The Intel Mac build can't run on this runner; the others can.
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/ryter --version
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="ryter-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ryter" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ryter-${{ matrix.target }}
          path: |
            dist/ryter-${{ matrix.target }}.tar.gz
            dist/ryter-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Ryter installs an update only when this signature matches the release
      # key built into it (release/ryter-release.pub.pem). No key, no release.
      - name: sign the checksums
        env:
          RYTER_SIGNING_KEY: ${{ secrets.RYTER_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          if [ -z "${RYTER_SIGNING_KEY:-}" ]; then
            echo "::error::the RYTER_SIGNING_KEY secret is not set; releases must be signed"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.pem"
          printf '%s\n' "$RYTER_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out "$RUNNER_TEMP/sums.sig"
          rm -f "$key"
          # The signature must match the public key every Ryter is built with.
          openssl pkeyutl -verify -pubin -inkey release/ryter-release.pub.pem -rawin \
            -in dist/SHA256SUMS -sigfile "$RUNNER_TEMP/sums.sig"
          base64 -w0 "$RUNNER_TEMP/sums.sig" > dist/SHA256SUMS.sig
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            flag=(--notes-file "$notes")
          else
            flag=(--generate-notes)
          fi
          gh release create "$tag" --draft --title "Ryter ${tag}" "${flag[@]}" \
            dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig
