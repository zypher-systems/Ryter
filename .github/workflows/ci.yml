name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS too: releases ship Mac binaries, so a Mac-only break must fail here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: version
        run: cargo run -p ryter-cli -- --version
      - name: Installer signature fixtures
        shell: bash
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            export RYTER_INSTALL_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi
          python3 scripts/test_install.py
      - name: Dependency advisories, licenses and sources
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --locked check advisories licenses sources
      - name: Dependency notice bundle
        if: runner.os == 'Linux'
        run: python3 scripts/license_bundle.py target/dependency-notices
