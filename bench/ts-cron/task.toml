title = "Make the cron parser take steps, names and both day fields, and find the next run"
level = "hard"
brief = """
A small TypeScript library, run by Node itself (`node --test`; no build step
and no packages; imports name the `.ts` file). `src/cron.ts` parses five-field
cron expressions with `*`, numbers, ranges and lists only, checks no bounds,
and finds the next run by walking minute by minute with both day fields
having to agree. Make it a real cron:

- Five whitespace-separated fields: minute (0-59), hour (0-23), day of the
  month (1-31), month (1-12), day of the week (0-7, where 0 and 7 are both
  Sunday). Another count is `expected 5 fields, got 4`.
- A field is a comma list of items; an item is `*`, a value, a range `a-b`,
  or any of those with a step: `*/n` (every n from the minimum), `a-b/n`
  (from a to b every n), `a/n` (from a to the maximum every n). Months take
  the names JAN..DEC and weekdays SUN..SAT, in any case, in ranges too
  (`MON-FRI`).
- Errors are `CronError`, messages exactly, the field named minute, hour,
  day, month or weekday: `minute out of range: 60`, `bad range in day: 10-5`
  (a range running backwards), `bad step in hour: */0` (a step that is not a
  whole number above zero), `unknown name in month: JUN3` (an item that is
  neither a number nor a name).
- `parse(expr)` returns a `Schedule` (see `src/cron.ts`): the sorted,
  deduplicated values of each field, weekdays with 7 folded into 0, and
  whether the day and weekday fields were restricted, which means written as
  anything but a bare `*`.
- `next(schedule, after)` is the first matching minute strictly after
  `after`, in UTC, with seconds and milliseconds zero, as a new `Date`. When
  both day fields are restricted, a day matches if either field matches it;
  when one is a bare `*`, the other decides; with neither restricted every
  day matches. With no match in the five years after `after`:
  `no match within 5 years`.

Done when `node --test test/basic.test.ts` passes.
"""
files = ["src/cron.ts"]
checks = ["node --test test/basic.test.ts"]
accept = ["node --test test/hidden.test.ts"]
# Whether this Node runs TypeScript as it is: one of the fixture's own modules.
needs = ["node repo/src/cron.ts"]
