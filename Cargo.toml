[workspace]
resolver = "2"
members = ["crates/ryter-core", "crates/ryter-tui", "crates/ryter-cli"]
default-members = ["crates/ryter-cli"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Zypher Systems"]
repository = "https://github.com/zypher-systems/ryter"
homepage = "https://github.com/zypher-systems/ryter"

[workspace.dependencies]
ryter-core = { path = "crates/ryter-core" }
ryter-tui = { path = "crates/ryter-tui" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
keyring = { version = "3", default-features = false, features = ["linux-native", "apple-native"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
regex = "1"
ignore = "0.4"
glob = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
landlock = "0.4"
# Pure-Rust highlighting: fancy-regex backend, no oniguruma C dependency.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
