# Copy to ~/.ryter/config.toml (chmod 600 if you put api_key here).

default_connection = "spacexai"

[connections.spacexai]
kind = "spacexai"
base_url = "https://api.x.ai/v1"
api_backend = "responses"
env_key = "XAI_API_KEY"
default_model = "grok-4.6"

[connections.openrouter]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_backend = "chat_completions"
env_key = "OPENROUTER_API_KEY"
default_model = "anthropic/claude-sonnet-4.6"
http_referer = "https://github.com/zypher-systems/ryter"
x_title = "Ryter"

# The model every hat uses. (The table is called `orchestrator` for a reason
# that is gone: the name is kept so existing configuration still loads.)
[orchestrator]
connection = "spacexai"
model = "grok-4.6"

# A hat can have a model of its own: plan, build, review, test. Set them in the TUI
# (/models), or uncomment:
# [specialists.review]
# connection = "openrouter"
# model = "anthropic/claude-sonnet-4.6"

[spend]
enabled = true
currency = "USD"
# Off (0) by default: set one with /budget.
session_budget_usd = 0
warn_usd = 1.00
# The most one turn in the review hat may spend. Off (0) by default: set it in /settings.
review_usd = 0

# TUI presentation. Every key is optional; defaults shown. Unknown keys warn once at
# startup instead of failing. `/theme` persists its pick to ~/.ryter/settings.toml [ui].
[ui]
username = ""              # speaker name for your messages; "" → git user.name → $USER → "you"
theme = "dark"             # dark | light | default-16 | <name> from ~/.ryter/themes/<name>.toml
layout = "ledger"          # ledger (timeline + bottom bar) | classic (chat beside the info cards, as in 0.5)
reasoning = "collapsed"    # collapsed | expanded | off — startup state of the thinking strip
mouse = true               # false disables mouse capture (use the terminal's own selection)
panel = true               # the rail (ledger) or the info panel (classic) at startup; ^b toggles it
colors = "auto"            # auto | truecolor | 256 | 16 ; NO_COLOR always wins
timestamps = true          # HH:MM on speaker headers (the ledger: beside each question)
line_numbers = true        # gutter in code blocks
receipts = true            # /commit adds a `Ryter:` trailer: model, cost, tests
offer_audit = true         # after a build turn that changed files, offer a review (asks first, shows the cost)
offer_test = true          # after a review that passed, offer a test of the running product (asks first, shows the cost)
open_pages = true          # open a page the model shows (show_page) in your browser; off, you get the link only

[mcp]
inbound = true
allow_dangerous = false
# socket = "~/.ryter/ryter.sock"   # TUI attach + `ryter serve --socket`
# bind = "127.0.0.1:8765"          # TCP inbound; token from /mcp or --token

# [mcp_servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# enabled = true

# Optional per-model USD / million tokens (wins over shipped / OpenRouter catalog).
# [pricing."grok-4.6"]
# input_per_million = 2.00
# cached_per_million = 0.50
# output_per_million = 6.00

# Lifecycle hooks. Command gets JSON on stdin; exit 2 (or HTTP 403) denies.
# [[hooks]]
# event = "PreToolUse"          # PreToolUse | PostToolUse | SessionStart | Handoff
# command = "/usr/local/bin/ryter-pre-tool"
# matcher = "bash"              # optional glob on the tool name
# # url = "http://127.0.0.1:9/hook"

# Landlock. Off by default. `workspace` or `read-only` fail closed if the kernel cannot enforce.
# [sandbox]
# profile = "off"               # off | workspace | read-only

# Updating Ryter itself. At launch (at most once a day): install a newer signed
# release in the background, only say it's out, or don't check. `ryter update`
# works either way.
# [update]
# mode = "install"              # install | notify | off

# Public web tools (SSRF-blocked: no localhost / private IPs). Off by default.
# [features]
# web = false

# Skills: ~/.ryter/skills/<name>/SKILL.md (user-invocable → /name)
# User slash: ~/.ryter/commands/<name>.md  ($ARGUMENTS)
# Themes: ~/.ryter/themes/<name>.toml ; /theme default-16 | dark | <name>

# Set the actual context window when a catalog omits it or a local server uses
# a smaller limit. Keys are exact model IDs; positive token counts only.
# [context_windows]
# "your-model-id" = 32768
